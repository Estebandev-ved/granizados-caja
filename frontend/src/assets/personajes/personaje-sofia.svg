<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 52 260 464" fill="none">
  <title>sofia</title>
  <ellipse cx="0" cy="495" rx="72" ry="9" fill="#0A0A0A" opacity="0.08"/>
    <!-- PIERNAS Y PANTALONES -->
    <path d="M-28 350 L-32 480 L-6 480 L-4 350 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M4 350 L6 480 L32 480 L28 350 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
    <!-- Zapatos blancos con detalle rojo -->
    <path d="M-44 474 C-44 474 -34 466 -6 466 C4 466 7 475 7 484 C7 488 -39 488 -44 484 Z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <path d="M-38 480 L-6 480" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
    <path d="M-7 466 C-7 466 3 466 31 466 C41 466 44 475 44 484 C44 488 -2 488 -7 484 Z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <path d="M3 480 L35 480" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>

    <!-- CUERPO GEOMÉTRICO (Chaqueta roja estructurada #E53935 con ribetes #C62828) -->
    <!-- Blusa interna blanca -->
    <path d="M-20 220 L20 220 L15 355 L-15 355 Z" fill="#FFFFFF"/>
    <!-- Chaqueta roja -->
    <path d="M-45 220 C-45 204 -25 195 0 195 C25 195 45 204 45 220 L55 352 C55 360 46 366 34 366 L-34 366 C-46 366 -55 360 -55 352 Z" fill="#E53935" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
    <!-- Detalles de chaqueta / solapa y costura -->
    <path d="M0 195 L0 366" stroke="#0A0A0A" stroke-width="2" stroke-dasharray="6,3"/>
    <path d="M-22 230 L-22 320" stroke="#C62828" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 230 L22 320" stroke="#C62828" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Botón / pin Antigravity en solapa -->
    <rect x="-32" y="222" width="12" height="12" rx="3" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5"/>
    <rect x="-27" y="227" width="5" height="5" fill="#E53935" transform="rotate(45 -24.5 229.5)"/>

    <!-- BRAZO DERECHO (Sosteniendo tableta tecnológica) -->
    <path d="M-44 218 L-65 285 C-68 293 -62 302 -52 305 L-30 308" fill="none" stroke="#E53935" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-44 218 L-65 285 C-68 293 -62 302 -52 305 L-30 308" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tableta digital -->
    <g transform="translate(-62, 280) rotate(-8)">
      <rect x="0" y="0" width="38" height="52" rx="4" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
      <rect x="3" y="3" width="32" height="46" rx="2" fill="#FFFFFF"/>
      <!-- Gráfico en pantalla de la tablet -->
      <rect x="6" y="8" width="16" height="4" rx="1" fill="#E53935"/>
      <rect x="6" y="15" width="26" height="2" rx="1" fill="#CCCCCC"/>
      <rect x="6" y="20" width="20" height="2" rx="1" fill="#CCCCCC"/>
      <!-- Barra gráfica miniatura -->
      <rect x="6" y="36" width="5" height="8" rx="1" fill="#0A0A0A"/>
      <rect x="13" y="30" width="5" height="14" rx="1" fill="#E53935"/>
      <rect x="20" y="26" width="5" height="18" rx="1" fill="#0A0A0A"/>
      <!-- Mano sosteniendo tablet -->
      <ellipse cx="28" cy="46" rx="6" ry="5" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>
    </g>

    <!-- BRAZO IZQUIERDO (Caída elegante al costado con mano neutra) -->
    <path d="M44 218 L60 285 C62 296 58 315 50 325" fill="none" stroke="#E53935" stroke-width="20" stroke-linecap="round"/>
    <path d="M44 218 L60 285 C62 296 58 315 50 325" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
    <!-- Mano izquierda -->
    <ellipse cx="48" cy="328" rx="7" ry="9" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>

    <!-- CUELLO -->
    <rect x="-9" y="165" width="18" height="34" rx="3" fill="#F5D0C5" stroke="#0A0A0A" stroke-width="2"/>

    <!-- CABEZA REDONDA GRANDE (Proporción estilizada consistente) -->
    <!-- Cabello recogido / Moño elegante posterior -->
    <ellipse cx="0" cy="98" rx="26" ry="24" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
    <ellipse cx="0" cy="140" rx="36" ry="40" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="2"/>
    <!-- Cabello frontal peinado ordenado -->
    <path d="M-36 132 C-34 95 -10 90 0 90 C15 90 35 96 36 132 C28 116 12 110 -2 112 C-18 114 -28 122 -36 132 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
    <!-- Orejas -->
    <circle cx="-35" cy="142" r="5" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>
    <circle cx="35" cy="142" r="5" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>
    <!-- Pendiente discreto blanco -->
    <circle cx="-35" cy="144" r="1.5" fill="#FFFFFF"/>
    <circle cx="35" cy="144" r="1.5" fill="#FFFFFF"/>

    <!-- ROSTRO SERENO Y PROFESIONAL -->
    <!-- Cejas finas -->
    <path d="M-19 130 C-15 127 -9 127 -6 130" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
    <path d="M6 130 C9 127 15 127 19 130" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
    <!-- Ojos calmados / amables -->
    <circle cx="-13" cy="138" r="3" fill="#0A0A0A"/>
    <circle cx="13" cy="138" r="3" fill="#0A0A0A"/>
    <!-- Mejillas sutiles -->
    <ellipse cx="-20" cy="148" rx="6" ry="3" fill="#EF9A9A" opacity="0.6"/>
    <ellipse cx="20" cy="148" rx="6" ry="3" fill="#EF9A9A" opacity="0.6"/>
    <!-- Sonrisa serena -->
    <path d="M-8 155 C-4 160 4 160 8 155" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round"/>

    <!-- ETIQUETAS DE TEXTO (Inter) -->
</svg>
