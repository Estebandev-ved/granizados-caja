<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 4 360 306" fill="none">
  <title>vacio-pedidos</title>
    <!-- Recuadro contenedor -->

    <!-- Mini sombra en el suelo -->
    <ellipse cx="180" cy="285" rx="55" ry="7" fill="#E5E5E5"/>

    <!-- Personaje: Lucía con audífonos sosteniendo caja vacía -->
    <g transform="translate(180, 0)">
      <!-- Piernas y pantalones -->
      <path d="M-18 200 L-20 274 L-4 274 L-3 200 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
      <path d="M3 200 L4 274 L20 274 L18 200 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-28 270 C-28 270 -22 264 -4 264 C3 264 5 271 5 277 C5 280 -25 280 -28 277 Z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
      <path d="M-24 275 L-4 275" stroke="#E53935" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-5 264 C-5 264 2 264 21 264 C28 264 30 271 30 277 C30 280 -1 280 -5 277 Z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
      <path d="M2 275 L23 275" stroke="#E53935" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Cuerpo: Camiseta polo roja #E53935 -->
      <path d="M-30 115 C-30 105 -16 98 0 98 C16 98 30 105 30 115 L36 202 C36 207 30 211 22 211 L-22 211 C-30 211 -36 207 -36 202 Z" fill="#E53935" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
      <!-- Cuello polo negro en V -->
      <path d="M-12 100 L0 120 L12 100" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
      <path d="M0 120 L0 138" stroke="#0A0A0A" stroke-width="2"/>

      <!-- Cuello -->
      <rect x="-6" y="80" width="12" height="22" rx="2" fill="#F5D0C5" stroke="#0A0A0A" stroke-width="2"/>

      <!-- Cabeza con diadema de audífonos -->
      <ellipse cx="0" cy="65" rx="24" ry="26" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="2"/>
      <path d="M-24 62 C-22 34 -8 30 0 30 C8 30 22 34 24 62 C18 48 8 47 -1 47 C-10 47 -18 53 -24 62 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
      <circle cx="-23" cy="66" r="3.5" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>
      <circle cx="23" cy="66" r="3.5" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>
      <!-- Audífonos y micrófono -->
      <path d="M-25 64 C-25 24 25 24 25 64" fill="none" stroke="#0A0A0A" stroke-width="3"/>
      <rect x="-29" y="57" width="7" height="16" rx="3.5" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.5"/>
      <rect x="22" y="57" width="7" height="16" rx="3.5" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.5"/>
      <path d="M-26 68 C-24 80 -14 82 -6 80" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-5" cy="80" r="2.2" fill="#E53935"/>

      <!-- Rostro sereno / tranquilo -->
      <path d="M-12 59 C-9 57 -5 57 -3 59" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M3 59 C5 57 9 57 12 59" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="-8" cy="65" r="2" fill="#0A0A0A"/>
      <circle cx="8" cy="65" r="2" fill="#0A0A0A"/>
      <ellipse cx="-13" cy="70" rx="4" ry="2" fill="#EF9A9A" opacity="0.6"/>
      <ellipse cx="13" cy="70" rx="4" ry="2" fill="#EF9A9A" opacity="0.6"/>
      <path d="M-4 74 C-2 76 2 76 4 74" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Brazos convergiendo al centro sosteniendo caja abierta vacía -->
      <!-- Brazo izquierdo -->
      <path d="M-30 114 L-42 152 C-43 158 -38 165 -30 166 L-24 167" fill="none" stroke="#E53935" stroke-width="13" stroke-linecap="round"/>
      <path d="M-30 114 L-42 152 C-43 158 -38 165 -30 166 L-24 167" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
      <!-- Brazo derecho -->
      <path d="M30 114 L42 152 C43 158 38 165 30 166 L24 167" fill="none" stroke="#E53935" stroke-width="13" stroke-linecap="round"/>
      <path d="M30 114 L42 152 C43 158 38 165 30 166 L24 167" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>

      <!-- Caja abierta vacía en perspectiva frontal limpia -->
      <g transform="translate(0, 140)">
        <!-- Interior de la caja (vacío, tono gris claro neutro) -->
        <polygon points="-28,18 0,26 28,18 0,10" fill="#E5E5E5" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
        <!-- Solapa posterior izquierda abierta -->
        <polygon points="-28,18 -36,8 -10,6 0,10" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
        <!-- Solapa posterior derecha abierta -->
        <polygon points="28,18 36,8 10,6 0,10" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
        <!-- Cara frontal izquierda -->
        <polygon points="-28,18 0,26 0,54 -28,44" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
        <!-- Cara frontal derecha -->
        <polygon points="28,18 0,26 0,54 28,44" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
        <!-- Solapa frontal izquierda caída -->
        <polygon points="-28,18 0,26 -2,34 -26,24" fill="#F8F8F8" stroke="#0A0A0A" stroke-width="1.8" stroke-linejoin="round"/>
        <!-- Solapa frontal derecha caída -->
        <polygon points="28,18 0,26 2,34 26,24" fill="#F8F8F8" stroke="#0A0A0A" stroke-width="1.8" stroke-linejoin="round"/>
        <!-- Cinta adhesiva / sello rojo de Antigravity en la caja -->
        <path d="M-2,38 L-2,54" stroke="#E53935" stroke-width="3"/>
        <path d="M2,38 L2,54" stroke="#E53935" stroke-width="3"/>
        <!-- Manos sosteniendo la base de la caja -->
        <ellipse cx="-26" cy="38" rx="5" ry="4" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>
        <ellipse cx="26" cy="38" rx="5" ry="4" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Etiqueta pequeña en Inter -->
</svg>
