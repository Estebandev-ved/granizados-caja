<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 52 260 464" fill="none">
  <title>lucia</title>
  <style>
    .pop{transform-box:fill-box;transform-origin:center;animation:pop 3s ease-in-out infinite}
    @keyframes pop{0%,60%,100%{transform:scale(1)}72%{transform:scale(1.12)}84%{transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){.wave,.float,.shadow,.pop,.spin{animation:none}}
  </style>
  <ellipse cx="0" cy="495" rx="72" ry="9" fill="#0A0A0A" opacity="0.08"/>
    <!-- PIERNAS Y PANTALONES (Pantalón gris oscuro grafito elegante) -->
    <path d="M-28 350 L-32 480 L-6 480 L-4 350 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M4 350 L6 480 L32 480 L28 350 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
    <!-- Zapatos planos blancos -->
    <path d="M-44 474 C-44 474 -34 466 -6 466 C4 466 7 475 7 484 C7 488 -39 488 -44 484 Z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <path d="M-38 480 L-6 480" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>
    <path d="M-7 466 C-7 466 3 466 31 466 C41 466 44 475 44 484 C44 488 -2 488 -7 484 Z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <path d="M3 480 L35 480" stroke="#E53935" stroke-width="3" stroke-linecap="round"/>

    <!-- CUERPO GEOMÉTRICO (Camiseta polo roja #E53935) -->
    <path d="M-45 220 C-45 204 -25 195 0 195 C25 195 45 204 45 220 L54 352 C54 360 45 366 34 366 L-34 366 C-45 366 -54 360 -54 352 Z" fill="#E53935" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
    <!-- Cuello polo negro en V -->
    <path d="M-18 198 L0 230 L18 198" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
    <path d="M0 230 L0 265" stroke="#0A0A0A" stroke-width="2"/>
    <!-- Logo Antigravity en pecho -->
    <circle cx="24" cy="235" r="7" fill="#FFFFFF"/>
    <rect x="21.5" y="232.5" width="5" height="5" fill="#C62828" transform="rotate(45 24 235)"/>

    <!-- BRAZO DERECHO (Sosteniendo smartphone con burbuja de chat) -->
    <path d="M-44 218 L-58 275 C-62 284 -55 295 -44 298 L-15 296" fill="none" stroke="#E53935" stroke-width="20" stroke-linecap="round"/>
    <path d="M-44 218 L-58 275 C-62 284 -55 295 -44 298 L-15 296" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
    <!-- Teléfono y mano -->
    <g transform="translate(-16, 266)">
      <rect x="0" y="0" width="24" height="42" rx="4" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
      <rect x="2" y="3" width="20" height="34" rx="2" fill="#FFFFFF"/>
      <!-- Pantalla del chat -->
      <rect x="5" y="8" width="14" height="4" rx="2" fill="#E53935"/>
      <rect x="5" y="15" width="10" height="4" rx="2" fill="#E0E0E0"/>
      <rect x="7" y="22" width="12" height="4" rx="2" fill="#E53935"/>
      <!-- Mano rodeando smartphone -->
      <ellipse cx="4" cy="26" rx="6" ry="7" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>
    </g>

    <!-- Burbuja flotante de chat / WhatsApp arriba del celular -->
    <g class="pop">
    <g transform="translate(-75, 222)">
      <rect x="0" y="0" width="46" height="30" rx="8" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
      <!-- Pico de la burbuja -->
      <path d="M36 30 L42 38 L30 30 Z" fill="#FFFFFF"/>
      <path d="M34 30 L42 38 L28 30" stroke="#0A0A0A" stroke-width="2" fill="none"/>
      <rect x="33" y="28" width="5" height="4" fill="#FFFFFF"/>
      <!-- Icono mini check o puntos en el chat -->
      <circle cx="15" cy="15" r="2.5" fill="#0A0A0A"/>
      <circle cx="23" cy="15" r="2.5" fill="#E53935"/>
      <circle cx="31" cy="15" r="2.5" fill="#0A0A0A"/>
    </g>
    </g>

    <!-- BRAZO IZQUIERDO (Suelto natural) -->
    <path d="M44 218 L55 285 C57 296 53 315 45 325" fill="none" stroke="#E53935" stroke-width="20" stroke-linecap="round"/>
    <path d="M44 218 L55 285 C57 296 53 315 45 325" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="43" cy="328" rx="7" ry="9" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>

    <!-- CUELLO -->
    <rect x="-9" y="165" width="18" height="34" rx="3" fill="#F5D0C5" stroke="#0A0A0A" stroke-width="2"/>

    <!-- CABEZA CON AUDÍFONOS NEGROS DE DIADEMA Y MICRÓFONO -->
    <ellipse cx="0" cy="140" rx="36" ry="40" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="2"/>
    <!-- Cabello castaño oscuro/negro corto moderno -->
    <path d="M-36 136 C-34 94 -12 88 0 88 C12 88 34 94 36 136 C28 116 14 114 -2 114 C-16 114 -28 122 -36 136 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
    <!-- Orejas -->
    <circle cx="-35" cy="142" r="5" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>
    <circle cx="35" cy="142" r="5" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>

    <!-- Diadema de audífonos negros (#0A0A0A) -->
    <path d="M-37 138 C-37 76 37 76 37 138" fill="none" stroke="#0A0A0A" stroke-width="4"/>
    <!-- Almohadillas en orejas -->
    <rect x="-42" y="128" width="10" height="24" rx="5" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="32" y="128" width="10" height="24" rx="5" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
    <!-- Brazo de micrófono hacia la boca -->
    <path d="M-38 145 C-36 162 -22 165 -10 162" fill="none" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-9" cy="162" r="3" fill="#E53935"/>

    <!-- ROSTRO AMABLE Y RECEPTIVO -->
    <circle cx="-13" cy="138" r="3" fill="#0A0A0A"/>
    <circle cx="13" cy="138" r="3" fill="#0A0A0A"/>
    <ellipse cx="-20" cy="148" rx="6" ry="3" fill="#EF9A9A" opacity="0.6"/>
    <ellipse cx="20" cy="148" rx="6" ry="3" fill="#EF9A9A" opacity="0.6"/>
    <path d="M-7 154 C-3 160 3 160 7 154" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round"/>

    <!-- ETIQUETAS DE TEXTO (Inter) -->
</svg>
