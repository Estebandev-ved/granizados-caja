<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130 52 260 464" fill="none">
  <title>mateo</title>
  <style>
    .wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave 4s ease-in-out infinite}
    @keyframes wave{0%,36%,100%{transform:rotate(0)}6%{transform:rotate(-16deg)}12%{transform:rotate(8deg)}18%{transform:rotate(-16deg)}24%{transform:rotate(8deg)}30%{transform:rotate(0)}}
    @media (prefers-reduced-motion:reduce){.wave,.float,.shadow,.pop,.spin{animation:none}}
  </style>
  <ellipse cx="0" cy="495" rx="72" ry="9" fill="#0A0A0A" opacity="0.08"/>
    <!-- Mochila de reparto roja grande vista detrás en perspectiva -->
    <rect x="-56" y="215" width="34" height="135" rx="8" fill="#C62828" stroke="#0A0A0A" stroke-width="2"/>
    <rect x="-52" y="235" width="8" height="95" rx="4" fill="#E53935"/>
    <rect x="-50" y="275" width="22" height="4" fill="#FFFFFF"/>

    <!-- PIERNAS Y PANTALONES (Bermuda/pantalón operativo negro) -->
    <path d="M-28 350 L-32 480 L-6 480 L-4 350 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
    <path d="M4 350 L6 480 L32 480 L28 350 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
    <!-- Zapatillas urbanas -->
    <path d="M-44 474 C-44 474 -34 466 -6 466 C4 466 7 475 7 484 C7 488 -39 488 -44 484 Z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <path d="M-38 480 L-6 480" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round"/>
    <path d="M-7 466 C-7 466 3 466 31 466 C41 466 44 475 44 484 C44 488 -2 488 -7 484 Z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
    <path d="M3 480 L35 480" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round"/>

    <!-- TORSO / CHAQUETA CON CORREAS DE MOCHILA -->
    <path d="M-45 220 C-45 204 -25 195 0 195 C25 195 45 204 45 220 L54 352 C54 360 45 366 34 366 L-34 366 C-45 366 -54 360 -54 352 Z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
    <!-- Chaleco / detalles técnicos y correas rojas -->
    <path d="M-30 200 L-22 366" stroke="#E53935" stroke-width="8" stroke-linecap="round"/>
    <path d="M-30 200 L-22 366" stroke="#0A0A0A" stroke-width="2"/>
    <path d="M22 200 L16 366" stroke="#E53935" stroke-width="8" stroke-linecap="round"/>
    <path d="M22 200 L16 366" stroke="#0A0A0A" stroke-width="2"/>
    <!-- Cinturón y hebilla -->
    <rect x="-35" y="348" width="70" height="12" fill="#0A0A0A"/>
    <rect x="-8" y="346" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5"/>

    <!-- BRAZO IZQUIERDO EN REPOSO -->
    <path d="M-44 218 L-55 285 C-57 296 -53 315 -45 325" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
    <path d="M-44 218 L-55 285 C-57 296 -53 315 -45 325" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="-43" cy="328" rx="7" ry="9" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>

    <!-- BRAZO DERECHO EN GESTO DE SALUDO AMABLE (Waving / saludo) -->
    <g class="wave">
    <path d="M42 220 Q70 195 76 150 Q80 130 88 105" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
    <path d="M42 220 Q70 195 76 150 Q80 130 88 105" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
    <!-- Mano saludando -->
    <g transform="translate(88, 92) rotate(15)">
      <path d="M0 16 C-4 10 -1 0 9 0 C16 0 20 6 18 14 L16 22 C12 28 2 26 0 16 Z" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="2"/>
      <path d="M-2 13 C-7 11 -8 6 -3 4 C0 2 3 6 2 11 Z" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>
      <!-- Líneas cinéticas de saludo sutiles -->
      <path d="M22 2 C26 5 26 11 23 14" fill="none" stroke="#E53935" stroke-width="2" stroke-linecap="round"/>
      <path d="M28 -2 C33 4 33 14 28 20" fill="none" stroke="#E53935" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>
    </g>

    <!-- CUELLO -->
    <rect x="-9" y="165" width="18" height="34" rx="3" fill="#F5D0C5" stroke="#0A0A0A" stroke-width="2"/>

    <!-- CABEZA CON CASCO NEGRO URBANO (#0A0A0A) -->
    <ellipse cx="0" cy="140" rx="36" ry="40" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="2"/>
    <!-- Casco estilizado de moto/bici con contorno 2px -->
    <path d="M-40 135 C-40 85 -20 78 0 78 C20 78 40 85 40 135 C38 124 30 114 0 114 C-30 114 -38 124 -40 135 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
    <!-- Franja roja en el casco (acento) -->
    <path d="M-6 80 L6 80 L6 114 L-6 114 Z" fill="#E53935"/>
    <!-- Correa de seguridad del casco pasando por el mentón -->
    <path d="M-32 130 C-28 165 -15 174 0 174 C15 174 28 165 32 130" fill="none" stroke="#0A0A0A" stroke-width="2"/>

    <!-- OREJAS -->
    <circle cx="-35" cy="142" r="5" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>
    <circle cx="35" cy="142" r="5" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>

    <!-- ROSTRO AMABLE Y DESPIERTO -->
    <circle cx="-13" cy="138" r="3" fill="#0A0A0A"/>
    <circle cx="13" cy="138" r="3" fill="#0A0A0A"/>
    <ellipse cx="-20" cy="148" rx="6" ry="3" fill="#EF9A9A" opacity="0.6"/>
    <ellipse cx="20" cy="148" rx="6" ry="3" fill="#EF9A9A" opacity="0.6"/>
    <!-- Sonrisa simpática -->
    <path d="M-8 154 C-4 161 4 161 8 154" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round"/>

    <!-- ETIQUETAS DE TEXTO (Inter) -->
</svg>
