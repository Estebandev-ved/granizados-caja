<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 4 360 306" fill="none">
  <title>bienvenida</title>
  <style>
    .wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave 4s ease-in-out infinite}
    @keyframes wave{0%,36%,100%{transform:rotate(0)}6%{transform:rotate(-16deg)}12%{transform:rotate(8deg)}18%{transform:rotate(-16deg)}24%{transform:rotate(8deg)}30%{transform:rotate(0)}}
    @media (prefers-reduced-motion:reduce){.wave,.float,.shadow,.pop,.spin{animation:none}}
  </style>
    <!-- Recuadro contenedor -->

    <!-- Mini sombra plana en el suelo -->
    <ellipse cx="180" cy="285" rx="55" ry="7" fill="#E8CFC9"/>

    <!-- Personaje: Sofía saludando (cuerpo entero grande) -->
    <g transform="translate(180, 0)">
      <!-- Piernas y pantalones -->
      <path d="M-18 200 L-20 274 L-4 274 L-3 200 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
      <path d="M3 200 L4 274 L20 274 L18 200 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
      <!-- Zapatos blancos con franja roja -->
      <path d="M-28 270 C-28 270 -22 264 -4 264 C3 264 5 271 5 277 C5 280 -25 280 -28 277 Z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
      <path d="M-24 275 L-4 275" stroke="#E53935" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-5 264 C-5 264 2 264 21 264 C28 264 30 271 30 277 C30 280 -1 280 -5 277 Z" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
      <path d="M2 275 L23 275" stroke="#E53935" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Chaqueta roja estructurada (#E53935 con detalle #C62828) -->
      <path d="M-30 115 C-30 105 -16 98 0 98 C16 98 30 105 30 115 L36 202 C36 207 30 211 22 211 L-22 211 C-30 211 -36 207 -36 202 Z" fill="#E53935" stroke="#0A0A0A" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0 98 L0 211" stroke="#0A0A0A" stroke-width="2" stroke-dasharray="4,3"/>
      <path d="M-15 120 L-15 180" stroke="#C62828" stroke-width="2" stroke-linecap="round"/>
      <path d="M15 120 L15 180" stroke="#C62828" stroke-width="2" stroke-linecap="round"/>
      <!-- Pin Antigravity en solapa -->
      <rect x="-21" y="117" width="8" height="8" rx="2" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5"/>
      <rect x="-18" y="120" width="3" height="3" fill="#E53935" transform="rotate(45 -16.5 121.5)"/>

      <!-- Brazo izquierdo en reposo sutil -->
      <path d="M-30 114 L-42 160 C-44 167 -40 176 -34 180" fill="none" stroke="#E53935" stroke-width="13" stroke-linecap="round"/>
      <path d="M-30 114 L-42 160 C-44 167 -40 176 -34 180" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="-33" cy="182" rx="4.5" ry="6" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>

      <!-- Brazo derecho alzado saludando cálidamente -->
      <g class="wave">
      <path d="M28 114 Q48 95 52 68 Q54 52 60 38" fill="none" stroke="#E53935" stroke-width="13" stroke-linecap="round"/>
      <path d="M28 114 Q48 95 52 68 Q54 52 60 38" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
      <!-- Mano saludando -->
      <g transform="translate(60, 28) rotate(12)">
        <path d="M0 12 C-3 8 -1 0 7 0 C12 0 15 5 13 11 L12 17 C9 22 2 20 0 12 Z" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.8"/>
        <path d="M-2 10 C-5 8 -6 4 -2 3 C0 1 2 4 1 8 Z" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>
        <path d="M16 2 C19 5 19 9 17 12" fill="none" stroke="#E53935" stroke-width="1.8" stroke-linecap="round"/>
      </g>
      </g>

      <!-- Cuello -->
      <rect x="-6" y="80" width="12" height="22" rx="2" fill="#F5D0C5" stroke="#0A0A0A" stroke-width="2"/>

      <!-- Cabeza y moño elegante -->
      <ellipse cx="0" cy="38" rx="17" ry="16" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
      <ellipse cx="0" cy="65" rx="24" ry="26" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="2"/>
      <!-- Cabello frontal peinado ordenado -->
      <path d="M-24 60 C-22 36 -6 32 0 32 C10 32 23 36 24 60 C18 48 8 45 -1 46 C-12 47 -19 53 -24 60 Z" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="2"/>
      <circle cx="-23" cy="66" r="3.5" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>
      <circle cx="23" cy="66" r="3.5" fill="#FBE4DC" stroke="#0A0A0A" stroke-width="1.5"/>
      <circle cx="-23" cy="67" r="1" fill="#FFFFFF"/>
      <circle cx="23" cy="67" r="1" fill="#FFFFFF"/>

      <!-- Rostro sonriente y amable -->
      <path d="M-13 58 C-10 56 -6 56 -4 58" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M4 58 C6 56 10 56 13 58" fill="none" stroke="#0A0A0A" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="-9" cy="64" r="2.2" fill="#0A0A0A"/>
      <circle cx="9" cy="64" r="2.2" fill="#0A0A0A"/>
      <ellipse cx="-13" cy="70" rx="4" ry="2" fill="#EF9A9A" opacity="0.6"/>
      <ellipse cx="13" cy="70" rx="4" ry="2" fill="#EF9A9A" opacity="0.6"/>
      <path d="M-5 75 C-3 78 3 78 5 75" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Etiqueta pequeña en Inter -->
</svg>
